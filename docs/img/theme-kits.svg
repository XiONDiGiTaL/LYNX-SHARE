  </g>

  <!-- Avocado -->
  <g>
    <rect x="840" y="0" width="110" height="150" rx="10" fill="#12140F" stroke="#7FB53A" stroke-opacity="0.45"/>
    <rect x="854" y="26" width="82" height="32" rx="6" fill="#7FB53A"/>
    <text x="895" y="86" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7FB53A">Avocado</text>
    <text x="895" y="108" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a">#7FB53A</text>
  </g>

  <!-- Dragonfruit -->
  <g>
    <rect x="960" y="0" width="110" height="150" rx="10" fill="#170F18" stroke="#FF4FA3" stroke-opacity="0.45"/>
    <rect x="974" y="26" width="82" height="32" rx="6" fill="#FF4FA3"/>
    <text x="1015" y="86" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#FF4FA3">Dragonfruit</text>
    <text x="1015" y="108" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a">#FF4FA3</text>
  </g>

  <!-- Lychee -->
  <g>
    <rect x="1080" y="0" width="110" height="150" rx="10" fill="#161114" stroke="#F2A0B5" stroke-opacity="0.45"/>
    <rect x="1094" y="26" width="82" height="32" rx="6" fill="#F2A0B5"/>
    <text x="1135" y="86" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#F2A0B5">Lychee</text>
    <text x="1135" y="108" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a">#F2A0B5</text>
