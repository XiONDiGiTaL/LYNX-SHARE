<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 150" width="1190" height="150" role="img" aria-label="The ten food theme kits: Banana, Eggplant, Blueberry, Lime, Watermelon, Mango, Cherry, Avocado, Dragonfruit and Lychee">
  <rect x="0" y="0" width="1190" height="150" fill="#0b0b0c"/>

  <!-- Banana -->
  <g>
    <rect x="0" y="0" width="110" height="150" rx="10" fill="#17150D" stroke="#F2C21B" stroke-opacity="0.45"/>
    <rect x="14" y="26" width="82" height="32" rx="6" fill="#F2C21B"/>
    <text x="55" y="86" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#F2C21B">Banana</text>
    <text x="55" y="108" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a">#F2C21B</text>
  </g>

  <!-- Eggplant -->
  <g>
    <rect x="120" y="0" width="110" height="150" rx="10" fill="#141019" stroke="#8F5BD6" stroke-opacity="0.45"/>
