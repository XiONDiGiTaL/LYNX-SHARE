    <text x="175" y="86" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8F5BD6">Eggplant</text>
    <text x="175" y="108" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a">#8F5BD6</text>
  </g>

