    <text x="295" y="86" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#4E6BE8">Blueberry</text>
    <text x="295" y="108" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a">#4E6BE8</text>
  </g>

  <!-- Lime -->
  <g>
    <rect x="360" y="0" width="110" height="150" rx="10" fill="#12150E" stroke="#A6D81C" stroke-opacity="0.45"/>
